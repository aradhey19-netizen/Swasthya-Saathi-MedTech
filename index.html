<style>



/* Colors live here. Dark values are set twice: system dark and manual dark. */



:root{--bg:#EEF5FD;--card:#fff;--ink:#0F2740;--mut:#566B82;--line:#D5E2F1;--pri:#1565D8;--on:#fff;--navy:#0B2A4A;--soft:#E6F0FD;--ok:#0F7A62;--okbg:#E3F5EF;--warn:#9A4A06;--warnbg:#FFF1DC;--bad:#B3261E;--badbg:#FDECEC;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}



@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1626;--card:#10233B;--ink:#EAF2FB;--mut:#9DB2C9;--line:#26405F;--pri:#6FAEFF;--on:#06213F;--navy:#06101D;--soft:#15304F;--ok:#4CD1AE;--okbg:#12362E;--warn:#F5B454;--warnbg:#3A2C0F;--bad:#FFB4AB;--badbg:#3A1620}}



:root[data-theme=dark]{--bg:#0A1626;--card:#10233B;--ink:#EAF2FB;--mut:#9DB2C9;--line:#26405F;--pri:#6FAEFF;--on:#06213F;--navy:#06101D;--soft:#15304F;--ok:#4CD1AE;--okbg:#12362E;--warn:#F5B454;--warnbg:#3A2C0F;--bad:#FFB4AB;--badbg:#3A1620}



:root[data-hc]{--line:var(--ink);--mut:var(--ink)}



html{scroll-padding-top:env(safe-area-inset-top,0px)}



html,body{height:100%;margin:0}



body{font:400 1rem/1.55 Inter,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}



*,*::before,*::after{box-sizing:inherit}



svg{width:20px;height:20px;flex:none}



:focus-visible{outline:3px solid var(--pri);outline-offset:2px}



.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;color:#000;padding:8px;z-index:10}



/* Layout */



.app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100%;transition:grid-template-columns .2s}

.app.sidebar-closed{grid-template-columns:minmax(0,1fr)}

.app.sidebar-closed .sb{display:none}



.sb{background:var(--navy);color:#DCE8F7;padding:18px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}



.sb :focus-visible{outline-color:#fff}



.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;color:#fff;font-weight:700}



.logo small{display:block;font-weight:400;font-size:.72rem;color:#9DB6D3}



.logo svg{width:36px;height:36px;color:#5AA2FF;fill:#5AA2FF33}



.nb{display:flex;gap:12px;align-items:center;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;font-size:.92rem;text-align:left;cursor:pointer}



.nb:hover{background:#ffffff14}



.nb[aria-current=page]{background:#1565D8;color:#fff}



.sos{margin-top:auto;background:#ffffff12;border-radius:12px;padding:12px;font-size:.84rem}



main{overflow:auto;padding:0 28px 28px;outline:0}



.top{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:16px 0}



.pill,.ib{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:42px;font:inherit;font-size:.85rem;cursor:pointer}



.ib{width:42px;padding:0;justify-content:center}



.menu{display:inline-flex;margin-right:auto}



/* Text */



h1{font-size:1.7rem;line-height:1.2;margin:.1em 0}



h2{font-size:1.1rem;margin:0 0 .4em}



.sub{color:var(--mut);margin:.2em 0 16px}



small{color:var(--mut)}



.bad{color:var(--bad)}



.sm{width:20px;height:20px;vertical-align:-4px}



/* Cards and buttons */



.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}



.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin:10px 0}



.urg{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad);border-radius:12px;padding:14px;font-weight:600;margin:10px 0}



.two{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}



.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}



.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 20px;border:1.5px solid var(--pri);border-radius:10px;background:var(--pri);color:var(--on);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}



.btn.o{background:none;color:var(--pri)}



.lnk{background:none;border:0;color:var(--pri);text-decoration:underline;font:inherit;cursor:pointer;padding:0}



.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}



.chip{display:inline-flex;gap:6px;align-items:center;min-height:42px;padding:8px 16px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}



.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--on)}



.tag{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--pri)}



.tag.g{background:var(--okbg);color:var(--ok)}.tag.w{background:var(--warnbg);color:var(--warn)}



label{display:block;font-weight:600;font-size:.88rem;margin:14px 0 6px}



.f{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}



.tg{display:flex;gap:10px;align-items:center;font-weight:500;min-height:40px;margin:4px 0}



.tg input{width:22px;height:22px}



.st{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.88rem}



.st.on{color:var(--pri);font-weight:600}



.st i{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem}



.st.on i{background:var(--pri);color:var(--on)}



details{border-top:1px solid var(--line);padding:8px 0;margin:8px 0}



summary{cursor:pointer;font-weight:600;color:var(--pri);min-height:32px}



dt{font-weight:600;font-size:.85rem}dd{margin:0 0 8px;color:var(--mut)}



ul{padding-left:1.2em}



.list{list-style:none;padding:0;margin:0}



.rb{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--soft);border:0;border-radius:10px;padding:12px 14px;margin:6px 0;color:var(--ink);font:inherit;cursor:pointer}



/* Home */



.hero{display:flex;gap:20px;align-items:center;background:linear-gradient(120deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:20px;padding:26px 28px}



.hero>div{flex:1}



.hero .art{width:120px;height:120px;color:var(--pri);fill:var(--soft);stroke-width:1}



.ask{display:flex;gap:6px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 6px 6px 20px;margin:12px 0}



.ask:focus-within{border-color:var(--pri)}



.ask input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1.05rem;padding:10px 0;outline:0}



.ask .ib{border:0;background:none}



.go{width:46px;height:46px;border:0;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;cursor:pointer}



.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}



.act{display:flex;gap:14px;align-items:flex-start;min-height:92px;padding:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;cursor:pointer}



.act:hover{border-color:var(--pri)}



.act .i{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none}



.act b{display:block}.act span{color:var(--mut);font-size:.86rem}



/* Chat */



.m{max-width:min(720px,92%);padding:12px 16px;border-radius:16px;margin:10px 0}



.m.u{background:var(--pri);color:var(--on);margin-left:auto;border-bottom-right-radius:4px}



.m.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}



.m p{margin:.4em 0}.m ul{margin:.4em 0}



.bar{position:sticky;bottom:0}



.foot{color:var(--mut);font-size:.8rem;text-align:center;margin-top:24px}



\#toast{display:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:9;max-width:90%}



[data-calm] \\*{transition:none!important;animation:none!important}



@media(max-width:860px){



.app{grid-template-columns:1fr}



.sb{position:fixed;inset:0 auto 0 0;width:270px;z-index:5;padding-top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-100%);visibility:hidden;transition:transform .2s}



.sb.open{transform:none;visibility:visible}



.menu{display:inline-flex}main{padding:0 14px 24px}



.two{grid-template-columns:1fr}.hero{padding:18px}.hero .art{display:none}}





/* ===== Refined patient-first home page ===== */

main{max-width:1600px;width:100%;margin:0 auto;padding:0 clamp(16px,2.5vw,38px) 34px}

.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:14px 0;margin-bottom:8px}

.hero{position:relative;overflow:hidden;min-height:240px;gap:clamp(18px,3vw,44px);padding:clamp(22px,3.2vw,42px);border-radius:24px;background:linear-gradient(112deg,#e5f2ff 0%,#f6fbff 52%,#e7f7f2 100%);box-shadow:0 12px 34px #164e7a12}

:root[data-theme=dark] .hero{background:linear-gradient(112deg,#132e4c,#10263a 58%,#12352f)}

.hero>div{min-width:0;max-width:760px}.hero h1{font-size:clamp(1.75rem,3vw,2.5rem);letter-spacing:-.045em;margin:8px 0;color:var(--ink)}

.hero h2{font-size:clamp(1.05rem,1.8vw,1.35rem);font-weight:650;margin:0 0 8px}.hero .sub{max-width:620px;line-height:1.65;margin:0 0 16px}

.hero .art{width:min(34%,330px);height:auto;max-height:235px;object-fit:cover;display:block;flex:0 0 30%;border-radius:22px}

.hero .ask{max-width:800px;}.ask{max-width:800px;min-height:60px;box-shadow:0 5px 18px #174b7610;margin:18px 0 0;padding-left:18px;border-color:#c8def5}.ask input{font-size:1rem}

.go{width:46px;height:46px;transition:transform .18s,box-shadow .18s}.go:hover{transform:translateY(-1px);box-shadow:0 5px 12px #1565d844}

.home-label{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 2px 12px}.home-label h2{font-size:1.12rem;margin:0;letter-spacing:-.02em}.home-label p{margin:3px 0 0;color:var(--mut);font-size:.88rem}

.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 24px}.act{min-height:112px;align-items:center;padding:18px;gap:14px;border-radius:17px;box-shadow:0 4px 14px #153c6508;transition:transform .18s,border-color .18s,box-shadow .18s}

.act:hover{transform:translateY(-2px);box-shadow:0 10px 24px #153c6512;border-color:#9cc7f4}.act .i{width:48px;height:48px;border-radius:15px;background:#e7f1ff;color:#1766c9}

.act:nth-child(2) .i{background:#e3f7ef;color:#168264}.act:nth-child(3) .i{background:#e4f3ff;color:#1677b8}.act:nth-child(4) .i{background:#fff0d9;color:#a65c0b}.act:nth-child(5) .i{background:#e9e6ff;color:#6750c9}.act:nth-child(6) .i{background:#ffe9e1;color:#c25b36}

.act b{font-size:.96rem;line-height:1.35;margin-bottom:5px}.act span span{display:block;line-height:1.45}

.home-bottom{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:16px;align-items:stretch}.home-bottom .card{margin:0;border-radius:18px;padding:20px;box-shadow:0 4px 16px #153c6508}

.tip-card{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card),var(--okbg))}.tip-card .tip-art{float:right;width:86px;height:86px;object-fit:cover;margin:0 0 8px 12px;border-radius:16px}

.recent-home .rb{background:var(--bg);border:1px solid var(--line);margin-top:9px}.recent-home .rb b{font-size:.9rem;font-weight:600}

.home-safety{display:flex;gap:10px;align-items:flex-start;margin:20px 0 0;padding:13px 15px;border:1px solid var(--line);border-radius:14px;color:var(--mut);font-size:.83rem}.home-safety svg{color:var(--ok);margin-top:2px}

@media(min-width:1300px){.hero{min-height:260px}.hero .art{max-height:250px}}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .art{width:28%}}

@media(max-width:640px){main{padding:0 12px 24px}.top{padding:10px 0}.hero{padding:22px 18px;min-height:0;border-radius:19px}.hero .art{display:none}.hero h1{font-size:1.8rem}.ask{padding-left:13px;gap:2px}.ask .ib{width:36px}.grid{grid-template-columns:1fr;gap:10px;margin-bottom:18px}.act{min-height:84px;padding:14px}.act .i{width:44px;height:44px}.home-label{margin-top:21px}.home-bottom{grid-template-columns:1fr}.home-bottom .card{padding:16px}.two{grid-template-columns:1fr}}




/* ===== Centered assistant workspace and responsive chat ===== */
#v{width:100%;max-width:1240px;margin-inline:auto}
#msgs{width:100%;max-width:820px;margin:0 auto 18px}
#msgs:empty{display:none}
#v:has(#msgs) > h1,#v:has(#msgs) > .sub{text-align:center}
#v:has(#msgs) .chips{max-width:820px;margin:16px auto;justify-content:center}

.chat-welcome{text-align:center;max-width:720px;margin:12px auto 22px;color:var(--mut)}

#v:has(#msgs) .chat-examples{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:820px;margin:14px auto 20px}

@media(max-width:640px){#v:has(#msgs) .bar{padding:8px 0 12px}#msgs{max-width:100%}.m{max-width:96%}}

</style>



</head>

<script>



// ===== Small helpers =====



const $=s=>document.querySelector(s);



const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));



// Turns safe text into simple HTML: \\*\\*bold\\*\\*, "- " lists, paragraphs



const md=s=>{const safe=esc(String(s||""));return safe
.replace(/\\\*\\\*(.+?)\\\*\\\*/g,"<b>$1</b>")
.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
.split(/\n{2,}/).map(p=>/^- /.test(p)?'<ul>'+p.split("\n").map(x=>"<li>"+x.replace(/^- /,"")+"</li>").join("")+"</ul>":"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");};



const I={home:"M3 11l9-8 9 8M5 10v10h14V10",chat:"M4 5h16v11H9l-5 4z",pulse:"M3 12h4l2-6 4 12 2-6h6",pin:"M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11zM12 8a2 2 0 100 4 2 2 0 000-4z",bank:"M4 21V9l8-5 8 5v12M9 21v-6h6v6",rupee:"M7 5h10M7 9h10M7 5c5 0 5 7 0 7H7l7 7",user:"M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0",clock:"M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2",mark:"M6 3h12v18l-6-4-6 4z",gear:"M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2",mic:"M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zM6 11a6 6 0 0012 0M12 17v4",send:"M3 11l18-8-8 18-2-8z",menu:"M4 6h16M4 12h16M4 18h16",star:"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z",heart:"M12 21s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 6-8 11-8 11z",moon:"M20 14A8 8 0 0110 4a8 8 0 1010 10z",warn:"M12 3l10 18H2zM12 10v5M12 18v.01"};



const ic=(n,c="")=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${I[n]}"/></svg>`;



const opts=(a,v)=>a.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");



const chip=(o,k,v,a,on)=>`<button class="chip" data-a="${a}" data-o="${o}" data-k="${k}" data-v="${esc(v)}" aria-pressed="${on}">${esc(v)}</button>`;



const ago=ts=>{const m=(Date.now()-ts)/6e4;return m<2?"just now":m<60?Math.round(m)+" min ago":m<1440?Math.round(m/60)+" hours ago":Math.round(m/1440)+" days ago"};



function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4500)}







// ===== Saved settings (kept on this device only) =====



const D={theme:"system",font:100,calm:0,hc:0,voice:1,lang:"en",state:"",dist:"",keep:1,saved:[],chats:[]};



let st={...D};



try{st={...D,...JSON.parse(localStorage.getItem("ss"))}}catch{}



const save=()=>{try{localStorage.setItem("ss",JSON.stringify(st))}catch{}};



function applySet(){const r=document.documentElement;st.theme==="system"?r.removeAttribute("data-theme"):r.dataset.theme=st.theme;r.style.fontSize=st.font+"%";r.toggleAttribute("data-calm",!!st.calm);r.toggleAttribute("data-hc",!!st.hc);r.lang=st.lang}







// ===== Languages: add a new language by adding one object here =====



const L={en:{home:"Home",chat:"AI Health Assistant",sym:"Check Symptoms",hosp:"Nearby Hospitals",sch:"Government Schemes",fin:"Financial Assistance",guide:"Personalized Guidance",rec:"Recent Conversations",saved:"Saved Information",set:"Settings",hey:"Hello!",ph:"Ask anything about your health…"},



hi:{home:"होम",chat:"एआई स्वास्थ्य सहायक",sym:"लक्षण जांचें",hosp:"नज़दीकी अस्पताल",sch:"सरकारी योजनाएं",fin:"आर्थिक सहायता",guide:"व्यक्तिगत मार्गदर्शन",rec:"हाल की बातचीत",saved:"सहेजी जानकारी",set:"सेटिंग्स",hey:"नमस्ते!",ph:"अपनी सेहत के बारे में कुछ भी पूछें…"}};



const t=k=>(L[st.lang]||L.en)[k]||L.en[k];







// ===== Health knowledge base: name, keywords, signs, warning signs, doctor, tip, group =====



const KB=[



["Dengue","dengue,fever,headache,rash,body ache,joint pain,eye pain,mosquito","high fever, severe headache, pain behind the eyes, joint and muscle pain, rash","bleeding gums or nose, black stools, repeated vomiting, severe belly pain, extreme weakness","a general physician","Rest and drink plenty of fluids. Do not take aspirin or ibuprofen unless a doctor says so.","gen"],



["Malaria","malaria,fever,chills,shivering,sweating,headache,vomiting","fever with chills and shivering, sweating, headache, vomiting","confusion, fits, yellow eyes, very little urine, trouble breathing","a general physician","A blood test confirms it. Government health centres often test and treat malaria at low or no cost.","gen"],



["Typhoid","typhoid,fever,stomach pain,weakness,constipation,diarrhoea,headache","fever that rises day by day, weakness, stomach pain, loss of appetite","fever beyond 5 days, severe belly pain, black stools, confusion","a general physician","Drink boiled or safe water. A blood test helps confirm it.","gen"],



["Flu or common cold","flu,cold,cough,sore throat,runny nose,fever,sneezing,body ache","cough, sore throat, runny nose, mild fever, tiredness","trouble breathing, fever lasting over 3 days, chest pain, a child who will not drink","a general physician or paediatrician","Rest, warm fluids and hand washing help.","gen"],



["Diabetes","diabetes,sugar,thirst,frequent urination,weight loss,tired,blurred vision,wound","extra thirst, frequent urination, tiredness, weight loss, wounds that heal slowly","fruity breath, vomiting, confusion, very high or very low sugar","a physician or diabetologist","Regular sugar checks, balanced meals, daily walking and taking medicines on time are common precautions.","ncd"],

// ===== Finding matching conditions =====



function match(txt){const l=txt.toLowerCase();return KB.map(c=>({c,s:c[1].split(",").filter(w=>l.includes(w)).length+(l.includes(c[0].toLowerCase().split(" ")[0])?3:0)})).filter(x=>x.s).sort((a,b)=>b.s-a.s).map(x=>x.c)}



// One condition as a readable card



function rep(c){const [n,,s,w,d,a,g]=c;const rel=SCH.filter(x=>x.t==="all"||x.t.split(",").includes(g));



return `<article class="card"><h2>${n} <span class="tag">Possible match, not a diagnosis</span></h2><dl><dt>Common signs</dt><dd>${s}</dd><dt>Get care quickly if</dt><dd class="bad">${w}</dd><dt>Who to see</dt><dd>${d}</dd><dt>General advice</dt><dd>${a}</dd></dl><p><b>Programs that may help:</b> ${rel.map(x=>esc(x.n)).join(", ")}. <button class="lnk" data-a="go" data-v="sch">See details</button></p></article>`}

async function ai(hist,on){
  if(!window.claude || typeof window.claude.use!=="function") throw new Error("AI service is not configured");
  AI=AI||await window.claude.use("sample");

    hist.slice(-8).map(m=>(m.r==="u"?"Patient: ":"Assistant: ")+m.t).join("\n")+"\nAssistant:";
  const result=await AI(p,{cache:false,modelTier:"quick",onText:({text})=>{if(typeof text==="string")on(text)}});
  const answer=typeof result==="string"?result:result&&typeof result.text==="string"?result.text:"";
  if(!answer.trim()) throw new Error("AI service returned an empty response");

async function send(q){
  q=String(q||"").trim();
  if(!q || busy) return;
  busy=1;
  if(!cv.id) cv.id=Date.now();
  cv.m.push({r:"u",t:q});
  const a={r:"a",t:"",busy:1};
  cv.m.push(a);

  // Switch screens before requesting an answer, but never let a paint error block the reply.
  try { if(cur!=="chat") go("chat"); else paint(); } catch(e) { console.error("Chat display error:",e); }

  try {
    let out="";
    if(RED.test(q)) {
      out=URGENT;
    } else {
      out=quickAnswer(q)||"";
      if(!out) {
        try {
          const history=cv.m.filter(m=>!m.busy);
          const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error("AI response timed out")),15000));
          out=await Promise.race([ai(history,x=>{a.t=String(x||"");try{paint()}catch(e){console.error(e)}}),timeout]);
        } catch(err) {
          console.warn("AI unavailable; using local answer:",err);
          out=local(q);
        }
      }
    }
    if(typeof out!=="string" || !out.trim()) out=local(q);
    a.t=out;
  } catch(err) {
    console.error("Chat response error:",err);
    a.t=local(q)||"Sorry, I could not prepare a response. Please try asking in a different way.";
  } finally {
    delete a.busy;
    busy=0;
    try { keep(); } catch(e) { console.error("Could not save chat:",e); }
    try { paint(); } catch(e) { console.error("Could not render answer:",e); }
  }
}

if(x.dataset.sf){sf[x.dataset.sf]=x.value;render()}

if(k){st[k]=x.type==="checkbox"?+x.checked:x.type==="range"?+x.value:x.value;save();applySet();if(k!=="dist")render()}});



document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#sb").classList.remove("open")});

window.runTests=()=>{const r=[["dengue match",match("fever headache rash")[0][0]==="Dengue"],["red flag",RED.test("I have chest pain")],["safe text",!md("<script>").includes("<script>")],["no false alarm",!RED.test("I have a mild cold")]];r.forEach(([n,ok])=>console[ok?"log":"error"]((ok?"PASS ":"FAIL ")+n));return r.every(x=>x[1])};

applySet();render();
